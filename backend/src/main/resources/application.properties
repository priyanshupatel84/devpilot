# new settings for vm to run 
spring.application.name=backend

# Database - pointing to Azure VM
 spring.datasource.url=${DB_URL:jdbc:postgresql://172.198.69.1:5432/devpilot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Ollama server - pointing to Azure VM
spring.ai.ollama.base-url=http://172.198.69.1:11434

# Chat model
spring.ai.ollama.chat.model=llama3.1:8b

# Embedding model
spring.ai.ollama.embedding.model=nomic-embed-text

# GitHub Oauth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Ov23liU3SVcmIK5BtSwq}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:badb180961ae573403519d90e6b65e9c52e15e8b}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

# pg-vector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# app settings - local frontend
app.frontend-url=http://localhost:3000
app.cors.allowed-origins=http://localhost:3000
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:devpilot-local-encryp-key-change-me}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeeface}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50
